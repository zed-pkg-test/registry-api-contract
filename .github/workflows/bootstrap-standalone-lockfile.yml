# One-shot branch workflow; remove before merging.
name: bootstrap standalone dependency lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: zed-api-lock-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Regenerate and commit only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "chore: lock standalone zed-interfaces source"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
