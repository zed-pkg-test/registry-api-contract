name: Live acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2,5'
permissions:
  contents: read
concurrency:
  group: live-${{ github.repository }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CROSS_ORG_APP_ID: ${{ vars.CROSS_ORG_APP_ID }}
      CROSS_ORG_APP_PRIVATE_KEY: ${{ secrets.CROSS_ORG_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app-token
        if: env.CROSS_ORG_APP_ID != '' && env.CROSS_ORG_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ env.CROSS_ORG_APP_ID }}
          private-key: ${{ env.CROSS_ORG_APP_PRIVATE_KEY }}
          owner: zed-pkg
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Run live suite
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: ./scripts/run-live.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
