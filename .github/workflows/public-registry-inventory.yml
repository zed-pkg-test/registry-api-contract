name: public registry read-only inventory

on:
  push:
    branches:
      - agent/den-2788-20-package-batch
    paths:
      - .github/workflows/public-registry-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-registry-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: https://registry.zpkg.net

jobs:
  inventory:
    name: inspect the live API without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe health and public registry contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-public

          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            --dump-header evidence-public/health.headers \
            --write-out '%{http_code}\t%{url_effective}\n' \
            "$REGISTRY/healthz" \
            -o evidence-public/health.body \
            | tee evidence-public/health.result.tsv

          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 30 \
            --dump-header evidence-public/packages.headers \
            --write-out '%{http_code}\t%{url_effective}\n' \
            "$REGISTRY/v1/packages?limit=100&offset=0" \
            -o evidence-public/packages.json \
            | tee evidence-public/packages.result.tsv

          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 30 \
            --dump-header evidence-public/search.headers \
            --write-out '%{http_code}\t%{url_effective}\n' \
            "$REGISTRY/v1/search?q=zed&limit=100" \
            -o evidence-public/search.json \
            | tee evidence-public/search.result.tsv

          jq -e '
            type == "object"
            and (.items | type == "array")
            and (.total | type == "number")
            and (.total >= 0)
          ' evidence-public/packages.json >/dev/null
          jq -e '
            type == "object"
            and (.items | type == "array")
          ' evidence-public/search.json >/dev/null

          jq -n \
            --arg registry "$REGISTRY" \
            --arg health "$(cat evidence-public/health.body)" \
            --argjson packages "$(cat evidence-public/packages.json)" \
            --argjson search "$(cat evidence-public/search.json)" \
            '{
              registry: $registry,
              health: $health,
              package_total: $packages.total,
              packages: $packages.items,
              zed_search_count: ($search.items | length),
              zed_search_items: $search.items
            }' \
            > evidence-public/public-registry-inventory.json

          jq '{registry,health,package_total,zed_search_count,packages}' \
            evidence-public/public-registry-inventory.json

      - name: Upload read-only public inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-registry-inventory
          path: evidence-public/
          if-no-files-found: error
          retention-days: 30
