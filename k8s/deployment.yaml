# dd-zed-api-server — temporary bootstrap profile: Postgres metadata and
# artifact tarballs/zip files on pod-local tmpfs. This intentionally avoids
# R2/S3 while package fan-out is exercised end to end.
#
# Layer-2 (app-owned) manifest: namespace-scoped ONLY. The `zed` Namespace, its
# ResourceQuota/LimitRange and the default-deny NetworkPolicy are Layer-1, owned by
# ORESoftware/k8s-cluster (remote/argocd/projects/zed.tenant.yaml). Do NOT add a
# Namespace/ClusterRole/CRD here — the `zed` AppProject enforces
# clusterResourceWhitelist: [] and the sync will fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/name: dd-zed-api-server
    app.kubernetes.io/part-of: zed
spec:
  # Local tmpfs is process-local. Keep one replica until shared object storage
  # is enabled; multiple replicas would return intermittent artifact 404s.
  replicas: 1
  selector:
    matchLabels:
      app: dd-zed-api-server
  template:
    metadata:
      labels:
        app: dd-zed-api-server
        app.kubernetes.io/name: dd-zed-api-server
        app.kubernetes.io/part-of: zed
    spec:
      # Talks to Postgres over egress; never calls the k8s API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zed-api-server
          # `main` is a MUTABLE tag. With IfNotPresent a node that already
          # cached some older `main` never re-pulls, so replicas can silently
          # serve different builds and a rollout is not reproducible. `Always`
          # makes every pod start converge on the current `main`.
          # The real fix is pinning by digest in the GitOps overlay
          # (zed-infra/k8s/manifests/zed-api-server/overlays/prod) so the
          # deployed revision is declared, reviewable, and rollback-able.
          image: ghcr.io/zed-pkg/zed-api-server:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: BIND_ADDR, value: "0.0.0.0:8080" }
            - { name: PUBLIC_BASE_URL, value: "https://registry.zpkg.tech" }
            - { name: STORAGE_BACKEND, value: "local" }
            - { name: STORAGE_LOCAL_DIR, value: "/var/lib/zed/artifacts" }
            # TEMPORARY bootstrap posture. Remove both flags before opening
            # registry mutation routes to untrusted callers.
            - { name: ZED_AUTH_DISABLED, value: "1" }
            - { name: ZED_RATE_LIMIT_DISABLED, value: "1" }
            - { name: ZED_VERIFY_TAGS, value: "off" }
            - { name: AUTO_MIGRATE, value: "true" }
            - { name: MAX_ARTIFACT_BYTES, value: "104857600" }
            - { name: RUST_LOG, value: "info" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: dd-zed-api-secrets, key: ZED_API_DATABASE_URL }
          # A DB/R2 blip should take the pod out of the Service, not restart it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: artifacts, mountPath: /var/lib/zed/artifacts }
          lifecycle:
            preStop:
              # Let endpoint removal propagate before shutdown so in-flight
              # publishes are not cut off.
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: artifacts
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
