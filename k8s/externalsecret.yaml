# Secrets for dd-zed-api-server, materialized by External Secrets Operator.
#
# Layer-2 (app-owned), namespace-scoped. The ClusterSecretStore itself is
# Layer-1 and lives in ORESoftware/k8s-cluster. Only true secrets belong here:
# the R2 endpoint URL, bucket name, and registry base URL are public-ish config
# and stay inline in deployment.yaml.
#
# NAME IS PER-SERVICE ON PURPOSE (see the daedalus incident: multiple services
# claiming one target Secret under prune+selfHeal fight forever).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-zed-api-secrets
  namespace: zed
  labels:
    app.kubernetes.io/part-of: zed
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-zed-api-secrets
    creationPolicy: Owner
  data:
    # Postgres DSN — carries a password, never inline.
    - secretKey: ZED_API_DATABASE_URL
      remoteRef:
        key: dd/remote-dev/zed-secrets
        property: ZED_API_DATABASE_URL
    # Cloudflare R2 credentials for the artifact bucket.
    - secretKey: ZED_R2_ACCESS_KEY_ID
      remoteRef:
        key: dd/remote-dev/zed-secrets
        property: ZED_R2_ACCESS_KEY_ID
    - secretKey: ZED_R2_SECRET_ACCESS_KEY
      remoteRef:
        key: dd/remote-dev/zed-secrets
        property: ZED_R2_SECRET_ACCESS_KEY
