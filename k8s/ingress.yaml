# Public host for the registry API. Layer-2 per the contract (Ingress is
# app-owned); the ingress-nginx controller + cert-manager ClusterIssuer are
# Layer-1. DNS for zpkg.tech lives in zed-infra/terraform/cloudflare — keep the
# record DNS-only until the certificate is issued (ACME HTTP-01 ordering).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-zed-api-server
  namespace: zed
  labels:
    app: dd-zed-api-server
    app.kubernetes.io/part-of: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Publishes stream tarballs up to MAX_ARTIFACT_BYTES (100 MiB).
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [registry.zpkg.tech]
      secretName: zed-api-server-tls
  rules:
    - host: registry.zpkg.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-api-server
                port:
                  number: 8080
