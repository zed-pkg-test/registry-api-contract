apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: dd-zed-api-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dd-zed-api-server
      spec:
        template:
          spec:
            containers:
              - name: zed-api-server
                env:
                  - name: PUBLIC_BASE_URL
                    value: https://registry.aws.zpkg.tech
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dd-zed-api-server
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: registry.aws.zpkg.tech
      - op: replace
        path: /spec/tls/0/secretName
        value: zed-api-server-aws-tls
      - op: replace
        path: /spec/rules/0/host
        value: registry.aws.zpkg.tech
