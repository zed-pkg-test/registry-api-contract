[build-system]
requires=["setuptools>=83.0.0"]
build-backend="setuptools.build_meta"
[project]
name="registry-api-contract-harness"
version="0.1.0"
requires-python=">=3.11"
dependencies=["PyYAML>=6.0.3,<7"]
[project.optional-dependencies]
test=["pytest>=8,<10"]
[tool.pytest.ini_options]
addopts="-ra"
testpaths=["tests"]
